plugins {
    id 'com.android.application'
}

// 发布签名：读取仓库根目录的 signing.properties（已 gitignore，不进仓库）。
// 缺失时退回 debug 签名，保证 CI 和任何人 clone 后都能直接构建。
def signingPropsFile = rootProject.file('signing.properties')
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def hasReleaseSigning = signingPropsFile.exists() && signingProps['storeFile']

android {
    namespace 'com.pocketledger.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.pocketledger.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // 有正式签名就用正式签名；否则用 debug 签名（方便侧载与 CI）
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // No third-party runtime dependencies: the UI is a bundled WebView app,
    // persistence is localStorage inside the WebView, and CSV export goes
    // through MediaStore. That keeps the APK tiny and fully offline.
}

tasks.register('printVersion') {
    doLast { println "${android.defaultConfig.versionName} (${android.defaultConfig.versionCode})" }
}
