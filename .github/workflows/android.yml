name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu runner 自带 Android SDK（platforms;android-34、build-tools 已装好），
      # 不需要再跑 setup-android 拉命令行工具（那一步经常因为下载源不稳定失败）。
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew --no-daemon --console=plain assembleDebug assembleRelease

      - name: Show APK info
        run: |
          ls -lh app/build/outputs/apk/debug app/build/outputs/apk/release
          unzip -l app/build/outputs/apk/release/app-release.apk | head -n 20

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ledger-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ledger-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
